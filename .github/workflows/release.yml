name: Release Automation

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Linux System Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential curl libappindicator3-dev librsvg2-dev patchelf squashfs-tools

      - name: Setup Node.js 22 & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI Verification Gate
        run: pnpm verify

      - name: Inspect Tag & Pre-release Status
        id: check_tag
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          if [[ "${TAG_NAME}" == *"-"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Tauri Distribution Bundles (Deb & AppImage)
        run: |
          # Tauri CLI bundle build with retry to handle transient external CDN 504 timeouts (e.g. AppRun binary)
          n=0
          until [ "$n" -ge 3 ]; do
            pnpm tauri build && break
            n=$((n+1))
            echo "::warning::tauri build failed (attempt $n/3), retrying in 10s..."
            sleep 10
          done
          [ "$n" -lt 3 ]

      - name: Package Multi-Target Release Artifacts
        env:
          BUILD_ID: ${{ steps.check_tag.outputs.tag_name }}
          VERSION: ${{ steps.check_tag.outputs.tag_name }}
        run: |
          chmod +x scripts/package_release.sh
          # Build Steam Deck user-space bundle, Arch package, and checksums
          bash scripts/package_release.sh "${{ steps.check_tag.outputs.tag_name }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.check_tag.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release_artifacts/*
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
